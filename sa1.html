<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Classificação GHS e Mosaico</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; }
        .container { max-width: 650px; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin: auto; }
        h2 { color: #333; margin-top: 0; }
        .checkbox-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: #444; }
        button { background-color: #007bff; color: white; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; transition: background 0.3s; }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        #toast { margin-top: 15px; padding: 12px; border-radius: 4px; display: none; text-align: center; font-weight: bold; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info-box { background: #e9ecef; padding: 10px; border-radius: 4px; margin-bottom: 15px; font-size: 14px; color: #333; }
    </style>
</head>
<body>

<div class="container">
    <h2>Classificação GHS do Produto</h2>
    <div id="info-prod" class="info-box">A carregar dados do produto...</div>

    <div class="checkbox-grid">
        <label><input type="checkbox" value="B1_XPEXPL"> Explosivo (B1_XPEXPL)</label>
        <label><input type="checkbox" value="B1_XPINFL"> Inflamável (B1_XPINFL)</label>
        <label><input type="checkbox" value="B1_XPOXID"> Oxidante (B1_XPOXID)</label>
        <label><input type="checkbox" value="B1_XPGASP"> Gás sob pressão (B1_XPGASP)</label>
        <label><input type="checkbox" value="B1_XPCORM"> Corrosivo p/ metais (B1_XPCORM)</label>
        <label><input type="checkbox" value="B1_XSCORP"> Corrosivo pele (B1_XSCORP)</label>
        <label><input type="checkbox" value="B1_XSTOXA"> Toxicidade aguda (B1_XSTOXA)</label>
        <label><input type="checkbox" value="B1_XSIRRP"> Irritação ocular (B1_XSIRRP)</label>
        <label><input type="checkbox" value="B1_XSPERA"> Perigo aspiração (B1_XSPERA)</label>
        <label><input type="checkbox" value="B1_XSMAQU"> Perigo aquático (B1_XSMAQU)</label>
    </div>

    <!-- Canvas oculto fixado exatamente em 250px por 75px -->
    <canvas id="canvasMosaico" width="250" height="75" style="display:none;"></canvas>

    <button id="btnSalvar" onclick="gravarDados()">Gravar Classificação e Mosaico</button>
    <div id="toast"></div>
</div>

<script>
    // Recupera parâmetros da URL (ex: sal.html?cod=101.12...&filial=01)
    const urlParams = new URLSearchParams(window.location.search);
    const codProd = urlParams.get('cod') || "000001";
    const filial = urlParams.get('filial') || "01";

    document.getElementById('info-prod').innerText = `Produto: ${codProd} | Filial: ${filial}`;

    function mostrarMensagem(texto, ehErro) {
        const toast = document.getElementById('toast');
        toast.innerText = texto;
        toast.className = ehErro ? 'error' : 'success';
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 4000);
    }

    function gravarDados() {
        const btn = document.getElementById('btnSalvar');
        btn.innerText = "A processar e gravar...";
        btn.disabled = true;

        // 1. Coleta os campos marcados
        const checkboxes = document.querySelectorAll('.checkbox-grid input[type="checkbox"]:checked');
        const camposGHS = [];
        checkboxes.forEach(cb => camposGHS.push(cb.value));

        // 2. Desenha o mosaico no canvas dimensionado estritamente para 250x75 px
        const canvas = document.getElementById('canvasMosaico');
        const ctx = canvas.getContext('2d');
        
        // Fundo branco limpo
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, 250, 75);

        // Texto descritivo no mosaico
        ctx.fillStyle = "#333333";
        ctx.font = "bold 11px Arial";
        ctx.fillText(`GHS: ${codProd}`, 10, 18);
        
        // Desenha indicadores visuais dos perigos selecionados
        let xPos = 10;
        let yPos = 28;
        camposGHS.forEach((campo, index) => {
            ctx.fillStyle = "#d9534f"; // Vermelho GHS
            ctx.fillRect(xPos, yPos, 14, 14);
            xPos += 18;
            if (xPos > 230) {
                xPos = 10;
                yPos += 18;
            }
        });

        // 3. Converte para Base64 leve otimizado em JPEG qualidade 0.8 (tamanho final minúsculo)
        const base64Reduzido = canvas.toDataURL('image/jpeg', 0.8);

        // 4. Monta o payload JSON
        const payload = {
            campos: camposGHS,
            base64: base64Reduzido
        };

        const endpoint = `https://unimolbrasil207533.protheus.cloudtotvs.com.br:10307/rest/WSSALVAGHS/${filial}/${codProd}`;

        // 5. Envia requisição POST para o Protheus
        fetch(endpoint, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "tenantId": "01,0101",
                "Authorization": "Basic " // Insira suas credenciais se necessário
            },
            body: JSON.stringify(payload)
        })
        .then(response => {
            if (!response.ok) {
                throw new Error(`Falha no REST: ${response.status}`);
            }
            return response.json();
        })
        .then(data => {
            console.log("Sucesso:", data);
            mostrarMensagem("Gravado com sucesso!", false);
            btn.innerText = "Gravar Classificação e Mosaico";
            btn.disabled = false;
        })
        .catch(error => {
            console.error("Erro ao gravar:", error);
            mostrarMensagem("Erro ao comunicar com o Protheus.", true);
            btn.innerText = "Gravar Classificação e Mosaico";
            btn.disabled = false;
        });
    }
</script>

</body>
</html>
