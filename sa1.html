<script>
    let state = {};

    document.addEventListener("DOMContentLoaded", function() {
      const urlParams = new URLSearchParams(window.location.search);
      const cod  = urlParams.get('cod') || '';
      const desc = urlParams.get('desc') || '';
      const sel  = urlParams.get('sel') || '';

      if (cod || desc) {
        document.getElementById("txtProd").innerText = "Produto: " + cod + (desc ? " - " + decodeURIComponent(desc) : "");
      }

      state = {
        "B1_XPEXPL": false, "B1_XPINFL": false, "B1_XPOXID": false, "B1_XPGASP": false, "B1_XPCORM": false,
        "B1_XSCORP": false, "B1_XSTOXA": false, "B1_XSIRRP": false, "B1_XSPERA": false, "B1_XSMAQU": false
      };

      if (sel) {
        const selDecoded = decodeURIComponent(sel);
        const aSel = selDecoded.split(',');
        aSel.forEach(function(field) {
          const cFld = field.trim();
          if (cFld && state.hasOwnProperty(cFld)) {
            state[cFld] = true;
          }
        });
      }
      renderState();
    });

    function toggleGHS(field) {
      state[field] = !state[field];
      renderState();
    }

    function renderState() {
      let count = 0;
      for (let field in state) {
        let card = document.getElementById("card_" + field);
        if (card) {
          if (state[field]) {
            card.classList.add("selected");
            count++;
          } else {
            card.classList.remove("selected");
          }
        }
      }
      document.getElementById("txtCount").innerText = "Perigos selecionados: " + count + " de 10";
    }

    function showToastAndClose(message, isError = false) {
      const toast = document.getElementById('custom-toast');
      toast.innerText = message;
      toast.className = 'custom-toast' + (isError ? ' error' : '');
      toast.style.display = 'block';
      setTimeout(() => toast.style.opacity = '1', 10); 

      // Fecha a janela do TWebEngine após 1.2 segundos da mensagem de sucesso
      if (!isError) {
        setTimeout(() => {
            window.close();
        }, 1200);
      }
    }

    function gerarMosaicoGHS() {
        try {
            var canvas = document.createElement('canvas');
            var ctx = canvas.getContext('2d');
            var imgSize = 64; 
            var cols = 5; 
            var images = document.querySelectorAll('.card-ghs.selected img'); 
            
            if (images.length === 0) return "";

            canvas.width = cols * imgSize;
            canvas.height = Math.ceil(images.length / cols) * imgSize;
            
            ctx.fillStyle = "#FFFFFF";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            images.forEach(function(img, index) {
                var x = (index % cols) * imgSize;
                var y = Math.floor(index / cols) * imgSize;
                if (img.complete && img.naturalWidth > 0) {
                    ctx.drawImage(img, x, y, imgSize, imgSize);
                }
            });

            var base64Full = canvas.toDataURL('image/jpeg', 0.85);
            return base64Full.replace(/^data:image\/(png|jpg|jpeg);base64,/, "");
        } catch (err) {
            console.error("Erro ao gerar mosaico:", err);
            return "";
        }
    }

    function fecharJanela() {
      const btn = document.getElementById("btnSalvar");
      btn.innerText = "A gravar no Protheus...";
      btn.style.background = "#059669";
      btn.disabled = true;

      const aAtivos = [];
      for (let field in state) {
        if (state[field]) { aAtivos.push(field); }
      }
      const cSelecionados = aAtivos.join(',');
      const cBase64Mosaico = gerarMosaicoGHS();

      const payloadObj = { campos: cSelecionados, base64: cBase64Mosaico };
      const payloadStr = JSON.stringify(payloadObj);

      const urlParams = new URLSearchParams(window.location.search);
      const cod  = urlParams.get('cod') || '';
      const auth = urlParams.get('auth') || '';
      const endpoint = "https://unimolbrasil207533.protheus.cloudtotvs.com.br:10257/rest/WSSALVAGHS/01/" + encodeURIComponent(cod);

      fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json", "tenantId": "01,0101", "Authorization": auth },
        body: payloadStr
      })
      .then(response => {
        if (!response.ok) { throw new Error('Falha no REST: ' + response.status); }
        return response.json();
      })
      .then(data => {
        btn.innerText = "✓ Gravado com Sucesso!";
        showToastAndClose("Gravado com sucesso!", false);
      })
      .catch(error => {
        console.error("Erro ao gravar:", error);
        btn.innerText = "Erro na gravação!";
        btn.style.background = "#dc2626";
        btn.disabled = false;
        showToastAndClose("Erro ao comunicar com o Protheus.", true);
      });
    }
</script>
